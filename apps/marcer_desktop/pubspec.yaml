name: marcer_desktop
description: "Marcer GameDVD desktop app (Flutter, Surface A: inventory browser)."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  package_info_plus: ^9.0.0
  archive: ^4.5.2
  crypto: ^3.0.3
  marcer_catalog:
    path: packages/marcer_catalog
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  file_picker: ^11.0.3
  ftpconnect: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
