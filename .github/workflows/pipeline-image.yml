name: Pipeline Image

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'docker/**'
      - '.dockerignore'
      - 'LICENSE'
      - '.github/workflows/pipeline-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pipeline:latest
            ghcr.io/${{ github.repository }}/pipeline:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify webhook
        if: env.WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o webhook-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 600 \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN")
          echo "webhook: HTTP $http_code"
          cat webhook-response.json; echo
          updated=$(jq -r '.summary.updated // 0' webhook-response.json 2>/dev/null || echo 0)
          failed=$(jq -r '.summary.failed // 0' webhook-response.json 2>/dev/null || echo 0)
          echo "updated=$updated failed=$failed"
          if [ "$http_code" != "200" ] || [ "$updated" -le 0 ] || [ "$failed" -gt 0 ]; then
            echo "::error::webhook did not update the compose stack (HTTP $http_code, updated=$updated, failed=$failed)"
            exit 1
          fi
