name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Linux build host. `ubuntu-latest` migrates to 26.04 in
          # November 2026 and ubuntu-22.04 is retired on 2027-04-17, so 24.04
          # is the stable floor for the release artifact.
          - os: ubuntu-24.04
            artifact_name: linux-x64
          - os: macos-latest
            artifact_name: osx-arm64
          - os: windows-latest
            artifact_name: win-x64

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop toolchain
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Enable desktop targets
        run: |
          flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop

      - name: Install dependencies
        working-directory: apps/marcer_desktop
        run: flutter pub get

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: apps/marcer_desktop
        run: flutter build linux --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }} --dart-define=RELEASE_BUILD=true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/marcer_desktop
        run: flutter build macos --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }} --dart-define=RELEASE_BUILD=true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/marcer_desktop
        run: flutter build windows --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }} --dart-define=RELEASE_BUILD=true

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: apps/marcer_desktop
        run: |
          Copy-Item desktop.config.example.json build/windows/x64/runner/Release/desktop.config.example.json
          Copy-Item MarcerGameDvd-Hatari.cfg build/windows/x64/runner/Release/MarcerGameDvd-Hatari.cfg

          # Flutter recommends app-local Visual C++ runtime DLLs for ZIP
          # distributions. Copy them from the same VS toolchain that built the
          # app; Windows prefers them over a system-wide redistributable.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ toolchain not found' }
          $crt = Get-ChildItem (Join-Path $vsPath 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT') -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ redistributable CRT directory not found' }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $crt.FullName $dll
            if (-not (Test-Path $src)) { throw "Missing $dll in $($crt.FullName)" }
            Copy-Item $src 'build/windows/x64/runner/Release/'
          }
          Write-Host "Bundled Visual C++ runtime from $($crt.FullName)"

          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:GITHUB_WORKSPACE/MarcerDesktop-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip"

      - name: Create ZIP (Linux)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: apps/marcer_desktop/build/linux/x64/release/bundle
        run: |
          cp "$GITHUB_WORKSPACE/apps/marcer_desktop/desktop.config.example.json" .
          cp "$GITHUB_WORKSPACE/apps/marcer_desktop/MarcerGameDvd-Hatari.cfg" .
          zip -r "$GITHUB_WORKSPACE/MarcerDesktop-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip" .

      - name: Create ZIP (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/marcer_desktop
        run: |
          mkdir -p dist
          cp -R "build/macos/Build/Products/Release/MarcerGameDVDLauncher.app" dist/
          cp desktop.config.example.json dist/
          cp MarcerGameDvd-Hatari.cfg dist/
          ditto -c -k --sequesterRsrc dist "$GITHUB_WORKSPACE/MarcerDesktop-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarcerDesktop-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}
          path: MarcerDesktop-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Scope to desktop tags only, so launcher v* tags are ignored.
          PREV_TAG=$(git describe --tags --match 'desktop-v*' --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")

          COMMIT_HASH=$(git rev-list -n 1 ${CURRENT_TAG})
          BODY=$(git log -1 --format=%b ${COMMIT_HASH})

          if [ -n "$BODY" ]; then
            echo "$BODY" > release-notes.md
          elif [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release-notes.md
            echo "" >> release-notes.md
            git log --oneline ${PREV_TAG}..${CURRENT_TAG} >> release-notes.md
          else
            echo "## Initial release" > release-notes.md
          fi

          # Always link the release setup guide. The tag-specific URL points at
          # the documentation version that belongs to this release.
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "**Release setup guide:** https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guides/GETTING-STARTED.md" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Marcer Desktop v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: artifacts/**/*.zip
          generate_release_notes: false
