name: CI Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/marcer_desktop/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    paths:
      - 'apps/marcer_desktop/**'
      - '.github/workflows/ci-desktop.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/marcer_desktop
        run: flutter pub get

      - name: Analyze (app)
        working-directory: apps/marcer_desktop
        run: flutter analyze

      - name: Test (app)
        working-directory: apps/marcer_desktop
        run: flutter test

      - name: Analyze (catalog package)
        working-directory: apps/marcer_desktop/packages/marcer_catalog
        run: dart analyze

      - name: Test (catalog package)
        working-directory: apps/marcer_desktop/packages/marcer_catalog
        run: dart test
